<header class="bg-white border-bottom">
	<div class="container d-flex align-items-center justify-content-between py-3">
		<a routerLink="/" class="fs-4 fw-bold text-decoration-none text-dark">Printing House</a>
		<div class="d-flex gap-2">
			<a routerLink="/stampar/proizvod" class="btn btn-outline-secondary">Dodaj proizvod</a>
			<a routerLink="/stampar/kolicine" class="btn btn-outline-secondary">Ažuriranje količina</a>
			<a routerLink="/stampar/narudzbine" class="btn btn-outline-secondary">Naručeni proizvodi</a>
			<a routerLink="/stampar/licitacije" class="btn btn-outline-secondary">Licitacije</a>
			<button class="btn btn-outline-primary" (click)="logout()">Odjavi se</button>
		</div>
	</div>
</header>

<main class="container py-5">
	<section class="mx-auto" style="max-width: 48rem;">
		<div class="text-center mb-4">
			<h1 class="fw-bold mb-2">Profil</h1>
		</div>

		<form class="bg-white border p-4 p-md-5" (ngSubmit)="updateProfile()">
			<div class="row g-3">
				<div class="col-md-6">
					<label for="username" class="form-label">Korisničko ime</label>
					<input id="username" type="text" class="form-control" [value]="currentUser.username" disabled>
				</div>
				<div class="col-md-6">
					<label for="password" class="form-label">Nova lozinka</label>
					<input id="password" type="password" name="password" class="form-control" placeholder="Ostavite prazno da zadržite trenutnu" [(ngModel)]="newPassword">
				</div>
				<div class="col-md-6">
					<label for="firstname" class="form-label">Ime</label>
					<input id="firstname" type="text" name="firstname" class="form-control" [(ngModel)]="currentUser.firstname">
				</div>
				<div class="col-md-6">
					<label for="lastname" class="form-label">Prezime</label>
					<input id="lastname" type="text" name="lastname" class="form-control" [(ngModel)]="currentUser.lastname">
				</div>
				<div class="col-md-6">
					<label for="email" class="form-label">Email</label>
					<input id="email" type="email" name="email" class="form-control" [(ngModel)]="currentUser.email">
				</div>
				<div class="col-md-6">
					<label for="phone" class="form-label">Broj telefona</label>
					<input id="phone" type="tel" name="phone" class="form-control" [(ngModel)]="currentUser.phone">
				</div>
				<div class="col-md-6">
					<label for="profileImage" class="form-label">Profilna slika</label>
					<div class="mb-2">
						@if (previewUrl) {
							<img [src]="previewUrl" alt="Profilna slika" class="rounded-3 border" style="width: 80px; height: 80px; object-fit: cover;">
						} @else {
							<div class="rounded-3 border d-flex align-items-center justify-content-center bg-light text-muted" style="width: 80px; height: 80px; font-size: 2rem;">👤</div>
						}
					</div>
					<input id="profileImage" type="file" accept="image/*" (change)="onFileSelected($event)" class="form-control">
				</div>
			</div>

			<div class="border-top mt-4 pt-4">
				<div class="row g-3">
					<div class="col-md-6">
						<label for="nazivFirme" class="form-label">Naziv firme</label>
						<input id="nazivFirme" type="text" name="nazivFirme" class="form-control" [(ngModel)]="currentUser.nazivFirme">
					</div>
					<div class="col-md-6">
						<label for="pib" class="form-label">PIB</label>
						<input id="pib" type="text" name="pib" class="form-control" [(ngModel)]="currentUser.pib">
					</div>
					<div class="col-md-6">
						<label for="maticniBroj" class="form-label">Matični broj</label>
						<input id="maticniBroj" type="text" name="maticniBroj" class="form-control" [(ngModel)]="currentUser.maticniBroj">
					</div>
					<div class="col-md-6">
						<label for="adresa" class="form-label">Adresa</label>
						<input id="adresa" type="text" name="adresa" class="form-control" [(ngModel)]="currentUser.adresa">
					</div>
					<div class="col-md-6">
						<label for="grad" class="form-label">Grad</label>
						<input id="grad" type="text" name="grad" class="form-control" [(ngModel)]="currentUser.grad">
					</div>
				</div>
			</div>

			<button type="submit" class="btn btn-primary w-100 mt-4">Sačuvaj izmene</button>
		</form>
	</section>
</main>
