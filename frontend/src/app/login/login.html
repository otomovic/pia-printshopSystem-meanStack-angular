<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
	<section class="w-100" style="max-width: 28rem;">
		<div class="text-center mb-4">
			<h1 class="fw-bold mb-2">Login</h1>
		</div>

		<form class="bg-white border rounded-3 shadow-sm p-4">
			<div class="mb-3">
				<label for="username" class="form-label">Korisničko ime</label>
				<input id="username" type="text" name="username" class="form-control" [(ngModel)]="username" required>
			</div>

			<div class="mb-4">
				<label for="password" class="form-label">Lozinka</label>
				<input id="password" type="password" name="password" class="form-control" [(ngModel)]="password" required>
			</div>

			<button type="submit" class="btn btn-primary w-100" (click)="login()">Uloguj se</button>
		</form>

		@if (message) {
			<p class="text-danger text-center mt-3 mb-0">{{ message }}</p>
		}

		<p class="text-center mt-4 mb-0">
			<a routerLink="/register" class="link-primary fw-semibold text-decoration-none">Registracija</a>
		</p>
	</section>
</main>
