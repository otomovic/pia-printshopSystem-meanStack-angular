<main class="container py-5">
	<section class="mx-auto" style="max-width: 48rem;">
		<div class="text-center mb-4">
			<h1 class="fw-bold mb-2">Registracija</h1>
		</div>

		<form class="bg-white border p-4 p-md-5" (ngSubmit)="register()" (input)="onFormEdited()" (change)="onFormEdited()">
			<div class="row g-3">
				<div class="col-md-6">
					<label for="username" class="form-label">Korisničko ime</label>
					<input id="username" type="text" name="username" class="form-control" [(ngModel)]="user.username" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<label for="password" class="form-label">Lozinka</label>
					<input id="password" type="password" name="password" class="form-control" [(ngModel)]="user.password" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<label for="firstname" class="form-label">{{ (user.type === 'pravnoLice' || user.type === 'stamparija') ? 'Ime odgovornog lica' : 'Ime' }}</label>
					<input id="firstname" type="text" name="firstname" class="form-control" [(ngModel)]="user.firstname" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<label for="lastname" class="form-label">{{ (user.type === 'pravnoLice' || user.type === 'stamparija') ? 'Prezime odgovornog lica' : 'Prezime' }}</label>
					<input id="lastname" type="text" name="lastname" class="form-control" [(ngModel)]="user.lastname" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<label for="email" class="form-label">Email</label>
					<input id="email" type="email" name="email" class="form-control" [(ngModel)]="user.email" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<label for="phone" class="form-label">Broj telefona</label>
					<input id="phone" type="tel" name="phone" class="form-control" maxlength="10" [(ngModel)]="user.phone" required [disabled]="sent">
				</div>
				<div class="col-md-6">
					<select id="tip" name="tip" class="form-select" [(ngModel)]="user.type" required [disabled]="sent">
						<option value="" disabled>Tip naloga</option>
						<option value="fizickoLice">Fizičko lice</option>
						<option value="pravnoLice">Pravno lice</option>
						<option value="stamparija">Štamparija</option>
					</select>
				</div>
				<div class="col-12">
					<label class="form-label">Profilna slika</label>
					<div class="d-flex align-items-center gap-3">
						@if (previewUrl) {
							<img [src]="previewUrl" alt="Profilna slika" class="rounded-3 border" style="width: 60px; height: 60px; object-fit: cover;">
						}
						<input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" class="form-control" [disabled]="sent">
						@if (selectedFile || imageError) {
							<button type="button" class="btn btn-outline-danger text-nowrap" (click)="removeImage()" [disabled]="sent">Ukloni sliku</button>
						}
					</div>
					@if (imageError) {
						<p class="text-danger small mt-1 mb-0">{{ imageError }}</p>
					}
				</div>
			</div>

			@if (user.type === 'pravnoLice' || user.type === 'stamparija') {
				<div class="border-top mt-4 pt-4">
					<div class="row g-3">
						<div class="col-md-6">
							<label for="nazivFirme" class="form-label">Naziv firme</label>
							<input id="nazivFirme" type="text" name="nazivFirme" class="form-control" [(ngModel)]="user.nazivFirme" required [disabled]="sent">
						</div>
						<div class="col-md-6">
							<label for="pib" class="form-label">PIB</label>
							<input id="pib" type="text" name="pib" class="form-control" maxlength="9" [(ngModel)]="user.pib" required [disabled]="sent">
						</div>
						<div class="col-md-6">
							<label for="maticniBroj" class="form-label">Matični broj</label>
							<input id="maticniBroj" type="text" name="maticniBroj" class="form-control" maxlength="8" [(ngModel)]="user.maticniBroj" required [disabled]="sent">
						</div>
						<div class="col-md-6">
							<label for="adresa" class="form-label">Adresa</label>
							<input id="adresa" type="text" name="adresa" class="form-control" [(ngModel)]="user.adresa" required [disabled]="sent">
						</div>
						<div class="col-md-6">
							<label for="grad" class="form-label">Grad</label>
							<input id="grad" type="text" name="grad" class="form-control" [(ngModel)]="user.grad" required [disabled]="sent">
						</div>
					</div>
				</div>
			}

			<button type="submit" class="btn btn-primary w-100 mt-4">Register</button>
		</form>

		@if (messageBad) {
			<p class="text-danger text-center mt-3 mb-0">{{ messageBad }}</p>
		}
		@if (messageGood) {
			<p class="text-success text-center mt-3 mb-0">{{ messageGood }}</p>
		}
	</section>
</main>
